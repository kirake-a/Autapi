services:
  mysql:
    image: 'mysql:latest'
    # command: --default-authentication-plugin=mysql_native_password
    environment:
      - 'MYSQL_DATABASE=autapi'
      - 'MYSQL_PASSWORD=4ut4p1D3v'
      - 'MYSQL_ROOT_PASSWORD=4ut4p1D3v'
    ports:
      - '3305:3306'
    volumes:
      - autapi-db:/var/lib/mysql
    networks:
      - default

  phpmyadmin:
    image: 'phpmyadmin:latest'
    links:
      - mysql:db
    ports:
      - 8000:80
    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root

volumes:
  autapi-db: